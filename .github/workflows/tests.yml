name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Tester les calculs, les caches et le rendu
        run: python -X utf8 -m unittest discover -v
      - name: Générer un tableau hors réseau
        run: python -X utf8 gpx2dash.py examples --depuis-cache --sans-routage --html demonstration.html --kml demonstration.kml
