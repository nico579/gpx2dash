name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}
      tag: ${{ github.event.inputs.tag || github.ref_name }}

  publish:
    name: Publish tested GitHub-built archives
    needs: validate-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gpx2dash-*
          path: artifacts
          merge-multiple: true
      - name: Verify archives and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          for archive in gpx2dash-windows-x86_64.zip gpx2dash-linux-x86_64.tar.gz gpx2dash-macos-arm64.tar.gz; do
            test -s "$archive"
            sha256sum --check "$archive.sha256"
          done
          cat *.sha256 > SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" gpx2dash-* SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" gpx2dash-* SHA256SUMS.txt --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
